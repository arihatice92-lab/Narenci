<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>Yönetici Girişi | Narenci</title>
	<link rel="stylesheet" href="../assets/bootstrap/css/bootstrap.min.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="../assets/fonts/themify-icons.css">
	<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-govde">
	<a class="skip-link" href="#icerik">İçeriğe geç</a>

	<main id="icerik" class="giris-sayfasi">

<div class="giris-kutu">
	<span class="brand-mark" aria-hidden="true"></span>
	<h1>Narenci</h1>
	<p class="alt">Yönetim paneli girişi</p>
	<div class="demo-not" role="note"><strong>Demo:</strong> Gerçek doğrulama yoktur; herhangi bir bilgiyle giriş yapabilirsiniz.</div>
	<form id="giris-formu" novalidate>
		<div class="alan"><label for="g-eposta">E-posta <span class="zorunlu" aria-hidden="true">*</span></label>
			<input type="text" id="g-eposta" name="eposta" autocomplete="username" required placeholder="yonetici@narenci.example"></div>
		<div class="alan"><label for="g-sifre">Şifre <span class="zorunlu" aria-hidden="true">*</span></label>
			<div class="sifre-satir"><input type="password" id="g-sifre" name="sifre" autocomplete="current-password" required>
			<button type="button" id="sifre-goster" aria-pressed="false" aria-controls="g-sifre">Göster</button></div></div>
		<button type="submit" class="btn btn-birincil" style="width:100%;justify-content:center">Giriş Yap</button>
		<p id="giris-not" class="ipucu" role="status" style="text-align:center;margin:12px 0 0"></p>
	</form>
	<p style="text-align:center;margin:18px 0 0"><a href="../index.html">← Siteye dön</a></p>
</div>

	</main>

	<div class="toast-alani" id="toast-alani" role="status" aria-live="polite"></div>
	<div class="modal fade" id="silModal" tabindex="-1" aria-labelledby="silBaslik" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
		<div class="modal-header"><h2 class="modal-title" id="silBaslik">Silmeyi onaylayın</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button></div>
		<div class="modal-body"><p id="silMetin">Bu kaydı silmek istediğinize emin misiniz?</p></div>
		<div class="modal-footer"><button type="button" class="btn btn-ikincil" data-bs-dismiss="modal">Vazgeç</button><button type="button" class="btn btn-tehlike" id="silOnay">Evet, sil</button></div>
	</div></div></div>
	<script src="../assets/bootstrap/js/bootstrap.min.js"></script>
	
	<script src="../assets/js/admin.js"></script>
</body>
</html>
